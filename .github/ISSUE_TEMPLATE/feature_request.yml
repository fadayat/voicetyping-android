name: Feature request
description: Suggest a focused improvement
title: "[Feature]: "
labels: [enhancement, triage]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user problem would this solve?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the behavior, not only the visual design.
    validations:
      required: true

  - type: textarea
    id: privacy
    attributes:
      label: Privacy and accessibility impact
      description: Explain whether the idea changes audio, transcript, credential, network, or accessibility handling.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
